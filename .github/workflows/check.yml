name: iOS checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build:resources
      - run: npm run check:localization && npm run check:privacy && npm run test:native
      - run: xcodebuild -project KARI.xcodeproj -scheme KARI -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath build/ci CODE_SIGNING_ALLOWED=NO build
